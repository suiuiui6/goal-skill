name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOAL_TEST_SKILLS_ROOT: ${{ github.workspace }}
      GOAL_TEST_GLOBAL_AGENTS: ${{ github.workspace }}/deployment/AGENTS.md
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -B -m pip install pytest
      - run: python -B -m pytest --rootdir . -p no:cacheprovider goal/scripts -q
      - run: python -B goal/scripts/validate_goal_skill.py goal
      - run: python -B tools/check_integrations.py
